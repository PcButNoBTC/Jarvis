services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://jarvis:change-me@db:5432/jarvis}
      LUMA_DELIVERY_ROOT: /data/delivery
      LUMA_DEPLOY_ROOT: /data/deploy
      LUMA_API_KEY: ${LUMA_API_KEY:-}
      LUMA_AUTH_SECRET: ${LUMA_AUTH_SECRET:-}
      INFISICAL_URL: ${INFISICAL_URL:-http://infisical:8080}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-prod}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/luma}
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./apps/worker
    environment:
      API_URL: http://api:8000
      LUMA_API_KEY: ${LUMA_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  preview:
    image: nginx:1.27-alpine
    volumes:
      - ./data/deploy:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
